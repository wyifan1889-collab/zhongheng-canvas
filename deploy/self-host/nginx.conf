server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve at request time so recreating the API does not pin its old IP.
    resolver 127.0.0.11;
    set $canvas_api http://api:4011;

    location ^~ /api/ {
        access_log off;
        proxy_pass $canvas_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
    }

    location = /healthz { proxy_pass $canvas_api; }
    location = /readyz { proxy_pass $canvas_api; }
    location = /config.js { add_header Cache-Control "no-store"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /assets { try_files /index.html =404; }
    location = /assets/ { try_files /index.html =404; }
    location ^~ /assets/ { try_files $uri =404; }
    location ~* ^/canvas/join(?:/|$) {
        access_log off;
        error_log /dev/null crit;
        try_files /index.html =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}
