server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep the SPA route `/assets` distinct from Vite's static `/assets/*`
    # directory; otherwise nginx treats the page as a directory and returns
    # 403 instead of serving the app entry.
    location = /assets {
        try_files /index.html =404;
    }

    location = /assets/ {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;

        # Serve the SPA directly so neither access nor error logs retain invitations.
        location ~* ^/canvas/join(?:/|$) {
            access_log off;
            error_log /dev/null crit;
            try_files /index.html =404;
        }
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
